name: Assignment 4 checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only_password
          MYSQL_DATABASE: queuesmart_db
          MYSQL_USER: queuesmart_app
          MYSQL_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: queuesmart_app
      DB_PASSWORD: ci_only_password
      DB_NAME: queuesmart_db
      DB_SSL_CA_PATH: ''
      QUEUESMART_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create test database tables
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i \
            -e MYSQL_PWD=ci_root_only_password \
            "$MYSQL_CONTAINER_ID" \
            mysql -uroot queuesmart_db \
            < backend/sql/001_schema.sql
      - run: npm run db:check
        working-directory: backend
      - run: npm run coverage > coverage-report.txt 2>&1
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage-report.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
